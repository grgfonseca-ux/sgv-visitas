        '<td class="n">'+pnSelo(pnN(t.dias), t.dias>120?'ruim':'aten')+'</td>' +
        '<td class="n">'+(t.total?pnBRL(t.total):'<span class="fraco">—</span>')+'</td></tr>').join('')
        || '<tr><td colspan="8" class="pn-vazio">Nenhum cliente frio.</td></tr>') +
      '</tbody></table></div>');
};

/* ---------- FOLLOW UP ---------- */
PN_TELAS.followup = function(d){
  const r = d.resumo, venc = d.followup.vencidos;
  const jaVenceram = r.fuOk + r.fuVenc;
  const porPessoa = {};
  venc.forEach(function(f){ porPessoa[f.pessoa] = (porPessoa[f.pessoa]||0) + 1; });
  const pessoas = Object.keys(porPessoa).sort(function(a,b){ return porPessoa[b]-porPessoa[a]; });

  return '<div class="pn-placas">' +
      pnPlaca('Compromissos assumidos', pnN(r.fuTotal),
        r.visitas ? pnPct(r.fuTotal/r.visitas)+' das visitas' : '', true) +
      pnPlaca('Vencidos', pnN(r.fuVenc), 'passaram da data sem conclusão') +
      pnPlaca('No prazo', pnN(r.fuPend), 'a data ainda não chegou') +
      pnPlaca('Taxa de cumprimento', pnPct(jaVenceram ? r.fuOk/jaVenceram : 0), 'dos que já venceram') +
    '</div>' +

    pnCartao('pn-g5','Vencidos por pessoa',
      'Indicador de disciplina, não de esforço: mede o que foi prometido ao cliente e não voltou.',
      '<div class="pn-rol"><table class="pn-tab"><thead><tr><th>Pessoa</th>' +
      '<th class="n">Vencidos</th></tr></thead><tbody>' +
      (pessoas.map(p => '<tr><td class="forte">'+esc(p)+'</td>' +
        '<td class="n">'+pnSelo(pnN(porPessoa[p]),'ruim')+'</td></tr>').join('')
        || '<tr><td colspan="2" class="pn-vazio">Nada vencido no período.</td></tr>') +
      '</tbody></table></div>') +

    pnCartao('pn-g7','O que ficou combinado e não voltou',
      'A ação é o texto que o próprio visitador escreveu na visita. ' +
      'O gestor lê e cobra; a correção continua sendo dele, pelo aplicativo.',
      (venc.map(function(f){
        return '<div class="pn-fu">' +
          '<div class="pn-fu-topo">' +
            '<span class="pn-fu-nome">'+esc(f.cliente)+'</span>' +
            pnSelo('venceu em '+pnData(f.data),'ruim') +
          '</div>' +
          '<div class="pn-fu-meta">'+esc(f.pessoa)+' · '+esc(f.cidade)+'/'+esc(f.uf)+
            (f.prioridade ? ' · prioridade '+esc(f.prioridade) : '')+'</div>' +
          '<div class="pn-fu-acao"><b>Ficou de:</b> ' +
            esc(f.acao || 'o visitador não descreveu a ação combinada') + '</div>' +
        '</div>';
      }).join('') || '<div class="pn-vazio">Nenhum compromisso vencido no período.</div>'));
};

/* ---------- VISITAS ---------- */
PN_TELAS.visitas = function(d){
  return pnCartao('pn-g12','Visitas registradas',
    'As ' + pnN(d.visitas.length) + ' mais recentes do filtro atual. É a aba VISITAS, legível.',
    '<div class="pn-rol"><table class="pn-tab"><thead><tr><th class="n">Data</th><th>Cliente</th>' +
    '<th>Especialidade</th><th>Cidade</th><th>Responsável</th><th>Conduziu</th>' +
    '<th class="n">Entregou</th><th class="n">Venda</th></tr></thead><tbody>' +
    (d.visitas.map(v => '<tr><td class="n">'+pnData(v.data)+'</td>' +
      '<td class="forte">'+esc(v.cliente)+'</td><td class="fraco">'+esc(v.esp)+'</td>' +
      '<td class="fraco">'+esc(v.cidade)+'/'+esc(v.uf)+'</td><td>'+esc(v.pessoa)+'</td>' +
      '<td class="fraco">'+esc(v.foco || '—')+'</td>' +
      '<td class="n fraco">'+(v.itens||'—')+'</td>' +
      '<td class="n">'+(v.venda?'<span class="forte">'+pnBRL(v.valor)+'</span>':'<span class="fraco">—</span>')+'</td></tr>').join('')
      || '<tr><td colspan="8" class="pn-vazio">Nenhuma visita no filtro.</td></tr>') +
    '</tbody></table></div>');
};

/* ---------- peças ---------- */
function pnPlaca(rot, val, sub, destaque){
  return '<div class="pn-placa'+(destaque?' destaque':'')+'">' +
    '<div class="rot">'+esc(rot)+'</div><div class="val">'+val+'</div>' +
    '<div class="sub">'+sub+'</div></div>';
}
function pnCartao(classe, titulo, desc, corpo){
  return '<div class="pn-cartao '+classe+'"><h3>'+esc(titulo)+'</h3>' +
    (desc ? '<p class="desc">'+esc(desc)+'</p>' : '') + corpo + '</div>';
}

/* ---------- desenho dos gráficos, depois do HTML no ar ---------- */
function pnDesenhar(){
  const d = PN.dados; if(!d) return;
  const box = id => document.getElementById(id);

  if(box('pn-g-visitas'))
    pnLinha(box('pn-g-visitas'), d.porMes.map(m => ({rot:pnRotMes(m.ym), val:m.visitas})), {unidade:'visitas'});
  if(box('pn-g-vendido'))
    pnLinha(box('pn-g-vendido'), d.porMes.map(m => ({rot:pnRotMes(m.ym), val:m.valor})),
      {moeda:true, cor1:PN_LARANJA, cor2:PN_LARANJA_CL});
  if(box('pn-g-funil')){
    /* Entregar amostra e fechar venda são desfechos independentes: uma venda
       pode sair sem amostra nenhuma. Por isso não é funil — as barras são
       ordenadas por tamanho, e não por etapa. */
    const desfechos = [
      {rot:'Com amostra ou brinde entregue', val:d.resumo.comEntrega},
      {rot:'Com venda fechada', val:d.resumo.comVenda}
    ].sort(function(a,b){ return b.val - a.val; });
    pnFunil(box('pn-g-funil'), [{rot:'Visitas realizadas', val:d.resumo.visitas}].concat(desfechos));
  }
  if(box('pn-g-equipe')){
    const meses = pnMeses();
    pnBarras(box('pn-g-equipe'), d.porPessoa.map(function(p){
      const alvo = Math.round(p.meta * meses);
      return { rot:p.nome, val:p.visitas, meta:alvo,
        dica:'<b>'+p.nome+'</b> — '+p.perfil.toLowerCase()+'<br>' +
             pnN(p.visitas)+' de '+pnN(alvo)+' previstas ('+(alvo?((p.visitas/alvo)*100).toFixed(0):0)+'%)<br>' +
             'conversão '+pnPct(p.comVenda/(p.visitas||1))+' · '+pnBRL(p.valor) };
    }), {rotulo:112});
  }
  if(box('pn-g-prod'))
    pnDuplas(box('pn-g-prod'), d.porProduto.slice(0,12).map(function(p){
      const t = p.apres ? p.vendas/p.apres : 0;
      return { rot:p.nome, a:p.apres, b:p.vendas, marca:pnPct(t),
        dica:'<b>'+p.nome+'</b><br>apresentado em '+pnN(p.apres)+' visitas<br>' +
             'fechou venda em '+pnN(p.vendas)+' — conversão '+pnPct(t)+'<br>' +
             'citado como já conhecido '+pnN(p.conhece)+' vezes' };
    }), {rotulo:132});
  if(box('pn-g-uf'))
    pnBarras(box('pn-g-uf'), d.porUF.map(u => ({rot:u.uf, val:u.visitas,
      dica:'<b>'+u.uf+'</b><br>'+pnN(u.visitas)+' visitas · '+pnN(u.clientes)+' clientes'})), {rotulo:38});
}

</script>
