<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>SGV Biodiversité — Registro de Visitas</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SGV Visitas">
<style>
:root{
  --verde:#14532d; --verde2:#166534; --verde3:#22c55e; --verde-cl:#dcfce7;
  --ouro:#b45309; --ouro-cl:#fef3c7;
  --tinta:#111827; --tinta2:#374151; --tinta3:#6b7280; --tinta4:#9ca3af;
  --linha:#e5e7eb; --fundo:#f7f8f7; --papel:#ffffff;
  --erro:#b91c1c; --erro-cl:#fee2e2;
  --info:#1d4ed8; --info-cl:#dbeafe;
  --r:14px; --sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  --sombra-g:0 4px 6px -1px rgba(16,24,40,.08),0 10px 15px -3px rgba(16,24,40,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--fundo); color:var(--tinta); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--fundo);position:relative;padding-bottom:76px}
button,input,select,textarea{font-family:inherit;font-size:16px}

/* ---------- TOPO ---------- */
.topo{
  position:sticky;top:0;z-index:40;background:var(--verde);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px;box-shadow:var(--sombra)
}
.topo h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px;flex:1}
.topo .sub{font-size:11.5px;opacity:.75;font-weight:400;display:block;margin-top:1px}
.btn-voltar{background:rgba(255,255,255,.16);border:0;color:#fff;width:32px;height:32px;border-radius:9px;font-size:17px;line-height:1;cursor:pointer;flex:none}
.pill-rede{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:20px;letter-spacing:.4px;flex:none}
.pill-rede.on{background:rgba(255,255,255,.2)}
.pill-rede.off{background:var(--ouro);color:#fff}

/* ---------- ESTRUTURA ---------- */
.tela{display:none;padding:14px 14px 20px;animation:entra .18s ease}
.tela.ativa{display:block}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sombra)}
.cartao.plano{box-shadow:none}
.titulo-secao{font-size:16.5px;font-weight:700;color:var(--tinta2);text-transform:none;letter-spacing:0;margin:20px 0 10px;line-height:1.3}
.titulo-secao:first-child{margin-top:0}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);padding:12px 13px;box-shadow:var(--sombra)}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .r{font-size:11px;color:var(--tinta3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:3px}
.kpi.destaque{background:var(--verde);border-color:var(--verde);color:#fff}
.kpi.destaque .r{color:rgba(255,255,255,.72)}
.kpi.alerta{background:var(--ouro-cl);border-color:#fcd34d}
.kpi.alerta .n{color:var(--ouro)}

.barra{height:7px;background:var(--linha);border-radius:99px;overflow:hidden;margin-top:9px}
.barra i{display:block;height:100%;background:var(--verde3);border-radius:99px;transition:width .5s ease}
.kpi.destaque .barra{background:rgba(255,255,255,.22)}
.kpi.destaque .barra i{background:#86efac}

/* ---------- FORM ---------- */
label.campo{display:block;margin-bottom:13px}
label.campo>span{display:block;font-size:18px;font-weight:600;color:var(--tinta);margin-bottom:8px;line-height:1.3}
label.campo>span em{font-style:normal;color:var(--erro)}
label.campo>span small{font-weight:400;color:var(--tinta4);font-size:11px}
input[type=text],input[type=date],input[type=number],input[type=tel],input[type=email],select,textarea{
  width:100%;padding:13px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--tinta);font-size:17px;
  outline:none;transition:border-color .15s,box-shadow .15s
}
textarea{min-height:88px;resize:vertical;line-height:1.5;font-size:17px}
input:focus,select:focus,textarea:focus{border-color:var(--verde2);box-shadow:0 0 0 3px var(--verde-cl)}
input.erro,select.erro{border-color:var(--erro);background:#fff5f5}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b7280' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tripla{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ajuda{font-size:14px;color:var(--tinta3);margin-top:6px;line-height:1.45}
.msg-erro{font-size:11.5px;color:var(--erro);margin-top:4px;font-weight:600;display:none}
.msg-erro.on{display:block}

/* chips de escolha */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:11px 15px;border:1px solid #d1d5db;border-radius:20px;background:#fff;
  font-size:15.5px;cursor:pointer;user-select:none;transition:all .13s;color:var(--tinta2);font-weight:500
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:600}
.chip.on.ouro{background:var(--ouro);border-color:var(--ouro)}

/* estrelas / escala */
.escala{display:flex;gap:6px}
.escala button{
  flex:1;padding:13px 0;border:1px solid #d1d5db;background:#fff;border-radius:10px;
  font-size:24px;cursor:pointer;transition:all .13s;line-height:1
}
.escala button.on{background:var(--verde-cl);border-color:var(--verde3);transform:translateY(-1px)}
.escala-legenda{display:flex;justify-content:space-between;font-size:13px;color:var(--tinta4);margin-top:6px}

/* botões */
.btn{
  display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--verde);color:#fff;
  font-size:15.5px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center
}
.btn:active{transform:scale(.985);background:var(--verde2)}
.btn:disabled{background:#d1d5db;color:#9ca3af;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn.neutro{background:#fff;color:var(--tinta2);border:1px solid #d1d5db}
.btn.perigo{background:var(--erro-cl);color:var(--erro);border:1px solid #fca5a5}
.btn.peq{padding:9px 14px;font-size:13.5px;width:auto;display:inline-block}
.linha-btn{display:flex;gap:9px;margin-top:6px}
.linha-btn .btn{flex:1}

/* ---------- WIZARD ---------- */
.passos{display:flex;gap:5px;padding:12px 14px 0}
.passos i{flex:1;height:4px;background:var(--linha);border-radius:9px;transition:background .3s}
.passos i.feito{background:var(--verde3)}
.passos i.atual{background:var(--verde)}
.passo-nome{padding:10px 14px 0;font-size:16px;color:var(--verde);font-weight:700;letter-spacing:.2px}

/* ---------- LISTAS ---------- */
.item{
  display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--papel);
  border:1px solid var(--linha);border-radius:12px;margin-bottom:8px;box-shadow:var(--sombra)
}
.item .txt{flex:1;min-width:0}
.item .t{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--tinta3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selo{font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:6px;letter-spacing:.4px;flex:none;text-transform:uppercase}
.selo.ok{background:var(--verde-cl);color:var(--verde)}
.selo.fila{background:var(--ouro-cl);color:var(--ouro)}
.selo.erro{background:var(--erro-cl);color:var(--erro)}
.selo.info{background:var(--info-cl);color:var(--info)}
.selo.cinza{background:#f3f4f6;color:var(--tinta3)}

.vazio{text-align:center;padding:40px 20px;color:var(--tinta4)}
.vazio .ic{font-size:38px;margin-bottom:10px;opacity:.5}
.vazio p{margin:0;font-size:13.5px}

/* contador de brinde */
.contador{display:flex;align-items:center;gap:0;border:1px solid #d1d5db;border-radius:9px;overflow:hidden;flex:none;background:#fff}
.contador button{width:40px;height:40px;border:0;background:#fff;font-size:21px;cursor:pointer;color:var(--verde);font-weight:700;line-height:1}
.contador button:active{background:var(--verde-cl)}
.contador button:disabled{color:#d1d5db}
.contador span{width:36px;text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}

/* ---------- NAV ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--papel);
  border-top:1px solid var(--linha);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 3px rgba(16,24,40,.05)
}
.nav button{
  flex:1;background:none;border:0;padding:8px 2px 7px;cursor:pointer;color:var(--tinta4);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s;position:relative
}
.nav button.on{color:var(--verde)}
.nav .ic{font-size:20px;line-height:1}
.nav .rot{font-size:9.5px;font-weight:700;letter-spacing:.2px}
.nav .bolha{
  position:absolute;top:4px;right:50%;margin-right:-20px;background:var(--ouro);color:#fff;
  font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 4px
}

/* ---------- AVISOS ---------- */
.aviso{padding:12px 14px;border-radius:11px;font-size:14px;margin-bottom:12px;line-height:1.55;border:1px solid}
.aviso.amarelo{background:var(--ouro-cl);border-color:#fcd34d;color:#78350f}
.aviso.azul{background:var(--info-cl);border-color:#93c5fd;color:#1e3a8a}
.aviso.verde{background:var(--verde-cl);border-color:#86efac;color:#14532d}
.aviso.vermelho{background:var(--erro-cl);border-color:#fca5a5;color:#7f1d1d}
.aviso b{font-weight:700}

/* toast */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--tinta);color:#fff;
  padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:500;z-index:200;opacity:0;
  pointer-events:none;transition:all .26s;max-width:400px;width:calc(100% - 40px);text-align:center;box-shadow:var(--sombra-g)
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--verde)}
#toast.err{background:var(--erro)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:150;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal-cx{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sobe .24s ease}
@keyframes sobe{from{transform:translateY(100%)}to{transform:none}}
.modal-cx h3{margin:0 0 4px;font-size:17px}
.puxador{width:38px;height:4px;background:var(--linha);border-radius:9px;margin:0 auto 14px}

/* busca */
.busca{position:relative;margin-bottom:10px}
.busca input{padding-left:36px}
.busca:before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}

.resultados{max-height:230px;overflow-y:auto;border:1px solid var(--linha);border-radius:11px;background:#fff;margin-top:-4px}
.resultados div{padding:11px 13px;border-bottom:1px solid #f3f4f6;cursor:pointer}
.resultados div:last-child{border-bottom:0}
.resultados div:active{background:var(--verde-cl)}
.resultados .rt{font-weight:600;font-size:13.5px}
.resultados .rs{font-size:11.5px;color:var(--tinta3)}

.tabela{width:100%;border-collapse:collapse;font-size:11.5px}
.tabela th{background:#f9fafb;text-align:left;padding:7px 8px;font-weight:700;color:var(--tinta2);border-bottom:1px solid var(--linha);white-space:nowrap}
.tabela td{padding:7px 8px;border-bottom:1px solid #f3f4f6;color:var(--tinta2)}
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--linha);border-radius:11px;background:#fff}

.divisor{height:1px;background:var(--linha);margin:14px 0}
.mini{font-size:11.5px;color:var(--tinta3);line-height:1.5}
.centro{text-align:center}
</style>
</head>

<div id="app"></div>

/* ---------- ARMAZENAMENTO (localStorage com queda para memória) ---------- */
const DB = (function(){
  let mem = {}, temLS = true;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ temLS = false; }
  return {
    disponivel: temLS,
    ler(k, padrao){
      try { if(temLS){ const v = localStorage.getItem('sgv.'+k); return v ? JSON.parse(v) : padrao; } } catch(e){}
      return (k in mem) ? mem[k] : padrao;
    },
    gravar(k, v){
      try { if(temLS){ localStorage.setItem('sgv.'+k, JSON.stringify(v)); return; } } catch(e){}
      mem[k] = v;
    },
    apagar(k){
      try { if(temLS){ localStorage.removeItem('sgv.'+k); return; } } catch(e){}
      delete mem[k];
    }
  };
})();

/* ---------- UTILITÁRIOS ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hoje(){ const d=new Date(); return d.toISOString().slice(0,10); }
function dataBR(iso){ if(!iso) return '—'; const p=String(iso).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso; }
function dinheiro(v){ return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function novoId(pre){ return pre + '-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2,6).toUpperCase(); }

/* Chave de deduplicação do cliente: só dígitos, sem zeros à esquerda.
   Resolve o caso 521762-9 vs 5251762-9 encontrado na planilha atual. */
function chaveCliente(doc, nome){
  const d = String(doc||'').replace(/\D/g,'').replace(/^0+/,'');
  if(d.length >= 4) return 'D'+d;
  return 'N' + String(nome||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]/g,'');
}

function toast(msg, tipo){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'on ' + (tipo||'');
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.className=''; }, 2600);
}

function entrarComToken(){
  const url = (document.getElementById('lg-url').value || '').trim();
  const tk  = (document.getElementById('lg-token').value || '').trim();

  if(!url){ toast('Informe o endereço do servidor','err'); return; }
  if(tk.length < 10){ toast('Token muito curto','err'); return; }

  setConfig('url', url);
  setConfig('token', tk);
  S.demo = false; DB.gravar('demo', false);
  S.ultimoErro = '';

  if(!conectado()){
    toast('Sem internet — a primeira entrada precisa de conexão','err');
    return;
  }

  toast('Verificando…');
  enviarAoServidor({ acao: 'bootstrap', token: tk }).then(function(r){
    if(!r.ok){ S.ultimoErro = r.erro || 'Token recusado'; render(); return; }
    aplicarBootstrap(r);
    S.tela = 'home'; render();
    toast('Bem-vindo, ' + S.usuario.nome, 'ok');
  }).catch(function(e){
    S.ultimoErro = 'Não consegui falar com o servidor: ' + e.message +
      '. Confira o endereço e se há internet.';
    render();
  });
}

/* Guarda tudo que veio do servidor. Usado na entrada e no "Baixar catálogos". */
function aplicarBootstrap(r){
  if(r.usuario){ S.usuario = r.usuario; DB.gravar('usuario', S.usuario); }
  if(r.saldo) S.estoque = r.saldo;
  if(r.clientes) S.clientes = mesclarClientes(S.clientes, r.clientes);
  if(r.followups) S.followups = mesclarFollowups(S.followups, r.followups);
  if(r.catalogos){
    const c = r.catalogos;
    if((c.produtos || []).length) CAT.ativos = c.produtos;
    if((c.brindes || []).length){
      CAT.materiais = c.brindes.map(function(b){ return { n: b.nome, t: b.tipo }; });
    }
    ['especialidades','acao','modalidade','tipoCliente','status','conhece','interesse','cidades']
      .forEach(function(k){ if((c[k] || []).length) CAT[k] = c[k]; });
    DB.gravar('catalogos', { ativos: CAT.ativos, materiais: CAT.materiais,
                             especialidades: CAT.especialidades, cidades: CAT.cidades });
  }
  salvarTudo();
}

function cartaoVisita(v, permitirEditar){
  const selo = v.sync === 'OK'      ? '<span class="selo ok">enviada</span>'
             : v.sync === 'EDITADO' ? '<span class="selo info">corrigida</span>'
             : v.sync === 'ERRO'    ? '<span class="selo erro">erro</span>'
             :                        '<span class="selo fila">na fila</span>';
  const qtdE = S.entregas.filter(function(e){ return e.idVisita === v.id; })
                         .reduce(function(s,e){ return s + e.qtd; }, 0);
  return '<div class="item">' +
    '<div class="txt"><div class="t">' + esc(v.clienteNome || '—') + '</div>' +
    '<div class="s">' + dataBR(v.data) + ' · ' + esc(v.cidade || '') +
      (qtdE ? ' · ' + qtdE + ' item' + (qtdE > 1 ? 's' : '') : '') +
      (Number(v.valorVenda) > 0 ? ' · ' + dinheiro(v.valorVenda) : '') + '</div>' +
    (permitirEditar ?
      '<div style="margin-top:8px"><button class="btn peq sec" ' +
      'onclick="abrirParaEditar(\'' + v.id + '\')">Corrigir</button></div>' : '') +
    '</div>' + selo + '</div>';
}

/* Traz uma visita já enviada de volta para o formulário.
   `editando` guarda o ID original — é ele que faz o salvamento virar correção
   em vez de criar uma visita nova. */
function abrirParaEditar(id){
  const v = S.visitas.find(function(x){ return x.id === id; });
  if(!v){ toast('Visita não encontrada','err'); return; }

  const entregas = {};
  S.entregas.filter(function(e){ return e.idVisita === id; })
            .forEach(function(e){ entregas[e.item] = e.qtd; });

  const f = S.followups.find(function(x){ return x.idVisita === id; });

  R = {
    id: id,
    editando: true,
    chaveAnterior: v.chaveCliente || '',
    entregasAnteriores: JSON.parse(JSON.stringify(entregas)),
    data: (v.data || '').slice(0,10),
    acao: v.acao || 'VISITA',
    modalidade: v.modalidade || 'PRESENCIAL',
    tipoCliente: v.tipoCliente || 'MÉDICO',
    status: v.status || 'REALIZADA',
    clienteNome: v.clienteNome || '', clienteDoc: v.clienteDoc || '',
    especialidade: v.especialidade || '', cidade: v.cidade || '', uf: v.uf || '',
    farmacia: v.farmacia || '', telefone: v.telefone || '', email: v.email || '',
    apresentados: (v.apresentados || '').split('|').map(function(x){return x.trim();}).filter(Boolean),
    conhecidos:   (v.conhecidos   || '').split('|').map(function(x){return x.trim();}).filter(Boolean),
    nivelConhece: v.nivelConhece || '', interesse: v.interesse || '',
    entregas: entregas,
    houveVenda: v.houveVenda || 'NÃO',
    valorVenda: v.valorVenda ? String(v.valorVenda) : '',
    notaMedico: Number(v.notaMedico) || 0, impressaoMedico: v.impressaoMedico || '',
    objecoes: v.objecoes || '',
    notaVisitador: Number(v.notaVisitador) || 0, impressaoVisitador: v.impressaoVisitador || '',
    precisaFollowup: f ? 'SIM' : (v.precisaFollowup || 'NÃO'),
    followupData: f ? (f.data || '') : (v.followupData || ''),
    followupAcao: f ? (f.acao || '') : (v.followupAcao || ''),
    obs: v.obs || ''
  };
  S.passo = 0;
  S.tela = 'visita';
  render();
  window.scrollTo(0,0);
}

/* Busca no servidor as últimas visitas deste visitador.
   Serve para editar em aparelho novo, onde o histórico local está vazio. */
function baixarUltimas(){
  if(S.demo){ toast('Em demonstração não há servidor','err'); return; }
  if(!S.config.url || !S.config.token){ toast('Configure o servidor em Dados','err'); return; }
  if(!conectado()){ toast('Sem internet','err'); return; }
  toast('Buscando suas últimas visitas…');

  enviarAoServidor({ acao:'ultimas', token: S.config.token, quantas: 5 }).then(function(r){
    if(!r.ok) throw new Error(r.erro || 'falha ao buscar');
    let novas = 0;
    (r.visitas || []).forEach(function(v){
      if(S.visitas.some(function(x){ return x.id === v.id; })) return;
      novas++;
      S.visitas.push({
        id: v.id, chaveCliente: '', visitador: S.usuario.nome,
        data: v.data, acao: v.acao, modalidade: v.modalidade, tipoCliente: v.tipoCliente,
        clienteDoc: v.clienteDoc, clienteNome: v.clienteNome,
        especialidade: v.especialidade, cidade: v.cidade, uf: v.uf, farmacia: v.farmacia,
        apresentados: v.apresentados, conhecidos: v.conhecidos,
        nivelConhece: v.nivelConhece, interesse: v.interesse,
        status: v.status, houveVenda: v.houveVenda, valorVenda: v.valorVenda,
        notaMedico: v.notaMedico, impressaoMedico: v.impressaoMedico, objecoes: v.objecoes,
        notaVisitador: v.notaVisitador, impressaoVisitador: v.impressaoVisitador,
        precisaFollowup: v.followup ? 'SIM' : 'NÃO',
        followupData: v.followup ? v.followup.data : '',
        followupAcao: v.followup ? v.followup.acao : '',
        obs: v.obs, sync: 'OK', doServidor: true
      });
      Object.keys(v.entregas || {}).forEach(function(item){
        S.entregas.push({
          id: 'E-SRV-' + v.id + '-' + item.replace(/[^A-Za-z0-9]/g,'').slice(0,8),
          idVisita: v.id, data: v.data, visitador: S.usuario.nome,
          clienteNome: v.clienteNome, clienteDoc: v.clienteDoc,
          cidade: v.cidade, uf: v.uf, item: item,
          tipo: (CAT.materiais.find(function(m){return m.n===item;})||{}).t || 'BRINDE',
          qtd: v.entregas[item], origem: 'VISITA', sync: 'OK'
        });
      });
      if(v.followup && v.followup.status === 'PENDENTE'){
        if(!S.followups.some(function(f){ return f.id === v.followup.id; })){
          S.followups.push({
            id: v.followup.id, idVisita: v.id, clienteNome: v.clienteNome,
            visitador: S.usuario.nome, data: v.followup.data, acao: v.followup.acao,
            cidade: v.cidade, uf: v.uf, status: 'PENDENTE', sync: 'OK'
          });
        }
      }
    });
    ordenarVisitas();
    salvarTudo(); render();
    toast(novas ? novas + ' visita(s) trazida(s) do servidor' : 'Você já tem as últimas aqui', 'ok');
  }).catch(function(e){ toast('Falha: ' + e.message, 'err'); });
}

function ordenarVisitas(){
  S.visitas.sort(function(a,b){
    const da = String(a.data||''), db = String(b.data||'');
    if(da !== db) return db.localeCompare(da);
    return String(b.criadoEm||'').localeCompare(String(a.criadoEm||''));
  });
}

function salvarRascunho(){
  if(R.editando) return;   // correção não vira rascunho
  S.rascunho = JSON.parse(JSON.stringify(R));
  DB.gravar('rascunho', S.rascunho);
}
function retomarRascunho(){ R = JSON.parse(JSON.stringify(S.rascunho)); S.passo = 1; irPara('visita'); }
function descartarRascunho(){ S.rascunho = null; DB.apagar('rascunho'); render(); toast('Rascunho descartado'); }
function sairDaVisita(){
  if(R.editando){ toast('Correção descartada'); novaVisita(); irPara('home'); return; }
  if(R.clienteNome || R.clienteDoc){ salvarRascunho(); toast('Salvo como rascunho'); }
  irPara('home');
}

function barraPassos(){
  return (R.editando ?
    '<div style="background:var(--info-cl);color:var(--info);text-align:center;' +
    'padding:6px 10px;font-size:12px;font-weight:700">CORRIGINDO UMA VISITA JÁ ENVIADA</div>' : '') +
    '<div class="passos">' +
    PASSOS.map((_,i) => '<i class="'+(i<S.passo?'feito':i===S.passo?'atual':'')+'"></i>').join('') +
    '</div><div class="passo-nome">'+PASSOS[S.passo]+'</div>';
}

function campo(rot, html, ajuda, obrig){
  return '<label class="campo"><span>'+rot+(obrig?' <em>*</em>':'')+'</span>'+html+
    (ajuda?'<div class="ajuda">'+ajuda+'</div>':'')+'</label>';
}
function chips(lista, valorAtual, fn, ouro){
  return '<div class="chips">' + lista.map(o =>
    '<span class="chip '+(valorAtual===o?'on'+(ouro?' ouro':''):'')+'" onclick="'+fn+'(\''+o.replace(/'/g,"\\'")+'\')">'+esc(o)+'</span>'
  ).join('') + '</div>';
}
function selectDe(lista, valor, onchange, vazio){
  return '<select onchange="'+onchange+'">' +
    '<option value="">'+(vazio||'Selecione…')+'</option>' +
    lista.map(o => '<option value="'+esc(o)+'"'+(valor===o?' selected':'')+'>'+esc(o)+'</option>').join('') +
    '</select>';
}

        '<input type="text" value="'+esc(R.farmacia)+'" oninput="setR(\'farmacia\',this.value)" placeholder="ex.: Dermatus, Avena, Farmacy">',

function escala(campo_){
  const v = R[campo_];
  const ic = ['😕','😐','🙂','😊','🤩'];
  return '<div class="escala">' + ic.map((e,i) =>
    '<button class="'+(v===i+1?'on':'')+'" onclick="setR(\''+campo_+'\','+(i+1)+');render()">'+e+'</button>'
  ).join('') + '</div><div class="escala-legenda"><span>baixo</span><span>alto</span></div>';
}

/* Lista de amostras, brindes e material, com filtro por nome.
   O que já foi escolhido aparece SEMPRE, mesmo fora do filtro — senão o
   visitador filtra, some o que ele já marcou, e acha que perdeu. */
function listaItens(filtro){
  const f = semAcentoApp(filtro || '').toUpperCase().trim();
  const grupos = ['AMOSTRA','BRINDE','MATERIAL'];
  const rot = {AMOSTRA:'Amostras de produto', BRINDE:'Brindes', MATERIAL:'Material de divulgação'};
  let achou = 0;

  const html = grupos.map(function(g){
    const itens = CAT.materiais.filter(function(m){
      if(m.t !== g) return false;
      if(!f) return true;
      if((R.entregas[m.n] || 0) > 0) return true;
      return semAcentoApp(m.n).toUpperCase().indexOf(f) >= 0;
    });
    if(!itens.length) return '';
    achou += itens.length;

    return '<div class="titulo-secao">' + rot[g] + ' (' + itens.length + ')</div>' +
      itens.map(function(m){
        const q = R.entregas[m.n] || 0;
        const saldo = (S.estoque[m.n] || 0);
        return '<div class="item" style="' + (q ? 'border-color:var(--verde3);background:#f6fef9' : '') + '">' +
          '<div class="txt"><div class="t">' + esc(m.n) + '</div>' +
          '<div class="s">saldo em mãos: ' + saldo + (saldo <= 0 ? ' — sem estoque' : '') + '</div></div>' +
          '<div class="contador">' +
            '<button onclick="menosItem(\'' + m.n.replace(/'/g,"\\'") + '\')" ' + (q <= 0 ? 'disabled' : '') + '>−</button>' +
            '<span>' + q + '</span>' +
            '<button onclick="maisItem(\'' + m.n.replace(/'/g,"\\'") + '\')" ' + (q >= saldo ? 'disabled' : '') + '>+</button>' +
          '</div></div>';
      }).join('');
  }).join('');

  if(!achou){
    return '<div class="vazio"><div class="ic">🔍</div><p>Nenhum item com “' + esc(filtro) + '”.<br>' +
           'Apague o filtro para ver todos.</p></div>';
  }
  return html;
}

function filtrarItens(v){
  R.filtroItens = v;
  document.getElementById('lista-itens').innerHTML = listaItens(v);
}

/* Compara sem acento: digitar "formula" acha "FÓRMULA". */
function semAcentoApp(s){
  return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function listaAtivos(tipo, filtro){
  const sel = tipo === 'ap' ? R.apresentados : R.conhecidos;
  const f = semAcentoApp(filtro || '').toUpperCase().trim();
  return CAT.ativos.filter(function(a){
    if(!f) return true;
    if(sel.indexOf(a) >= 0) return true;          // o já escolhido nunca some
    return semAcentoApp(a).toUpperCase().indexOf(f) >= 0;
  }).map(a =>
    '<span class="chip '+(sel.includes(a)?'on'+(tipo==='co'?' ouro':''):'')+'" ' +
    'onclick="alternarAtivo(\''+tipo+'\',\''+a.replace(/'/g,"\\'")+'\')">'+esc(a)+'</span>'
  ).join('');
}
function filtrarAtivos(v, tipo){ document.getElementById('lista-'+tipo).innerHTML = listaAtivos(tipo, v); }
function alternarAtivo(tipo, a){
  const arr = tipo === 'ap' ? R.apresentados : R.conhecidos;
  const i = arr.indexOf(a);
  if(i >= 0) arr.splice(i,1); else arr.push(a);
  render();
}

function resumoFinal(){
  const itens = Object.entries(R.entregas).filter(([,q]) => q > 0);
  return '<div class="cartao plano" style="background:#f9fafb">' +
    '<div class="titulo-secao" style="margin-top:0">Resumo</div>' +
    '<table class="tabela"><tbody>' +
    linhaR('Data', dataBR(R.data)) +
    linhaR('Cliente', R.clienteNome || '—') +
    linhaR('Documento', R.clienteDoc || '—') +
    linhaR('Local', (R.cidade||'—') + (R.uf ? ' / '+R.uf : '')) +
    linhaR('Apresentados', R.apresentados.length ? R.apresentados.join(', ') : 'nenhum') +
    linhaR('Já conhecia', R.conhecidos.length ? R.conhecidos.join(', ') : 'nenhum') +
    linhaR('Entregas', itens.length ? itens.map(([n,q]) => q+'× '+n).join('; ') : 'nenhuma') +
    linhaR('Venda', R.houveVenda === 'SIM' ? dinheiro(R.valorVenda) : R.houveVenda) +
    linhaR('Follow up', R.precisaFollowup === 'SIM' ? dataBR(R.followupData) : 'não') +
    '</tbody></table></div>';
}
function linhaR(r, v){
  return '<tr><td style="color:var(--tinta3);white-space:nowrap;vertical-align:top;width:34%">'+r+'</td>' +
         '<td style="font-weight:600">'+esc(v)+'</td></tr>';
}

/* setters */
function setR(k,v){ R[k] = v; if(['acao','tipoCliente','houveVenda','precisaFollowup'].includes(k)) render(); }
function setAcao(v){ R.acao = v; render(); }
function setModalidade(v){ R.modalidade = v; render(); }
function setTipoCliente(v){ R.tipoCliente = v; render(); }
function setStatus(v){ R.status = v; render(); }
function setVenda(v){ R.houveVenda = v; if(v!=='SIM') R.valorVenda=''; render(); }
function setNivel(v){ R.nivelConhece = v; render(); }
function setInteresse(v){ R.interesse = v; render(); }
function setFollowup(v){ R.precisaFollowup = v; render(); }
function maisItem(n){ const s = S.estoque[n]||0; const q = R.entregas[n]||0; if(q < s){ R.entregas[n] = q+1; render(); } }
function menosItem(n){ const q = R.entregas[n]||0; if(q > 0){ R.entregas[n] = q-1; if(!R.entregas[n]) delete R.entregas[n]; render(); } }

/* busca de cliente */
function buscarCliente(q){
  const cx = document.getElementById('res-cliente');
  if(!q || q.length < 2){ cx.innerHTML = ''; return; }
  const t = q.toUpperCase();
  const achados = S.clientes.filter(c =>
    (c.nome||'').toUpperCase().includes(t) || (c.doc||'').includes(q)).slice(0,6);
  cx.innerHTML = achados.length ?
    '<div class="resultados">' + achados.map(c =>
      '<div onclick="usarCliente(\''+c.chave+'\')"><div class="rt">'+esc(c.nome)+'</div>' +
      '<div class="rs">'+esc(c.doc||'sem documento')+' · '+esc(c.especialidade||'')+' · '+esc(c.cidade||'')+
      ' · '+c.visitas+' visita(s)</div></div>').join('') + '</div>'
    : '<div class="mini" style="padding:8px 2px">Nenhum cliente encontrado. Preencha abaixo para cadastrar.</div>';
}
function usarCliente(chave){
  const c = S.clientes.find(x => x.chave === chave);
  if(!c) return;
  Object.assign(R, {clienteNome:c.nome, clienteDoc:c.doc, especialidade:c.especialidade,
                    cidade:c.cidade, uf:c.uf, farmacia:c.farmacia, telefone:c.telefone, email:c.email});
  render();
  toast('Dados de ' + c.nome + ' preenchidos', 'ok');
}

function validarDoc(){
  const e = document.getElementById('e-doc');
  const d = String(R.clienteDoc||'').replace(/\D/g,'');
  if(R.clienteDoc && d.length < 4){ e.textContent = 'Documento muito curto — confira.'; e.classList.add('on'); }
  else e.classList.remove('on');
}

/* navegação entre passos, com validação */
function passo(dir){
  if(dir > 0 && !validarPasso()) return;
  S.passo = Math.max(0, Math.min(PASSOS.length-1, S.passo + dir));
  salvarRascunho();
  render();
  window.scrollTo(0,0);
}
function validarPasso(){
  const p = S.passo;
  if(p === 0 && !R.data){ toast('Informe a data da visita','err'); return false; }
  if(p === 1){
    if(!R.clienteNome.trim()){ toast('Informe o nome do cliente','err'); return false; }
    if(!R.cidade.trim() || !R.uf){ toast('Informe cidade e UF','err'); return false; }
    if(R.tipoCliente !== 'FARMÁCIA' && !R.especialidade){ toast('Informe a especialidade','err'); return false; }
  }
  if(p === 5 && R.precisaFollowup === 'SIM' && !R.followupData){
    toast('Informe a data do follow up','err'); return false;
  }
  return true;
}
/* ==========================================================================
   SALVAR · SINCRONIZAR · DEMAIS TELAS
   ========================================================================== */

function salvarVisita(){
  if(!validarPasso()) return;
  if(R.editando){ salvarCorrecao(); return; }

  const agora = new Date().toISOString();
  const chave = chaveCliente(R.clienteDoc, R.clienteNome);

  /* 1. VISITA — uma linha na aba VISITAS */
  const visita = {
    id: R.id, chaveCliente: chave, criadoEm: agora,
    visitador: S.usuario.nome, perfil: S.usuario.perfil,
    data: R.data, acao: R.acao, modalidade: R.modalidade,
    tipoCliente: R.tipoCliente, clienteDoc: R.clienteDoc, clienteNome: R.clienteNome,
    especialidade: R.especialidade, cidade: R.cidade, uf: R.uf, farmacia: R.farmacia,
    telefone: R.telefone, email: R.email,
    apresentados: R.apresentados.join(' | '),
    conhecidos: R.conhecidos.join(' | '),
    qtdApresentados: R.apresentados.length,
    nivelConhece: R.nivelConhece, interesse: R.interesse,
    status: R.status, houveVenda: R.houveVenda, valorVenda: Number(R.valorVenda)||0,
    notaMedico: R.notaMedico, impressaoMedico: R.impressaoMedico, objecoes: R.objecoes,
    notaVisitador: R.notaVisitador, impressaoVisitador: R.impressaoVisitador,
    precisaFollowup: R.precisaFollowup, followupData: R.followupData, followupAcao: R.followupAcao,
    obs: R.obs,
    sync: 'FILA'
  };
  S.visitas.unshift(visita);

  /* 2. ENTREGAS — uma linha por item (formato longo) */
  Object.entries(R.entregas).forEach(([nome, qtd]) => {
    if(qtd <= 0) return;
    const m = CAT.materiais.find(x => x.n === nome);
    S.entregas.unshift({
      id: novoId('E'), idVisita: R.id, data: R.data, visitador: S.usuario.nome,
      chaveCliente: chave, clienteDoc: R.clienteDoc, clienteNome: R.clienteNome,
      cidade: R.cidade, uf: R.uf,
      item: nome, tipo: m ? m.t : 'BRINDE', qtd: qtd,
      origem: 'VISITA', criadoEm: agora, sync: 'FILA'
    });
    S.estoque[nome] = Math.max(0, (S.estoque[nome]||0) - qtd);
  });

  /* 3. CLIENTES — cadastro único deduplicado */
  const existente = S.clientes.find(c => c.chave === chave);
  if(existente){
    existente.visitas++; existente.ultimaVisita = R.data;
    if(R.farmacia) existente.farmacia = R.farmacia;
    if(R.telefone) existente.telefone = R.telefone;
    if(R.email) existente.email = R.email;
  } else {
    S.clientes.push({
      chave, doc: R.clienteDoc, nome: R.clienteNome, tipo: R.tipoCliente,
      especialidade: R.especialidade, cidade: R.cidade, uf: R.uf, farmacia: R.farmacia,
      telefone: R.telefone, email: R.email,
      visitas: 1, primeiraVisita: R.data, ultimaVisita: R.data, sync: 'FILA'
    });
  }

  /* 4. FOLLOWUP */
  if(R.precisaFollowup === 'SIM' && R.followupData){
    S.followups.push({
      id: novoId('F'), idVisita: R.id, chaveCliente: chave,
      clienteDoc: R.clienteDoc, clienteNome: R.clienteNome,
      visitador: S.usuario.nome, data: R.followupData, acao: R.followupAcao,
      cidade: R.cidade, uf: R.uf, prioridade: 'MÉDIA',
      status: 'PENDENTE', criadoEm: agora, sync: 'FILA'
    });
  }

  salvarTudo();
  S.rascunho = null; DB.apagar('rascunho');

  const qtdItens = Object.values(R.entregas).reduce((s,q)=>s+q,0);
  novaVisita();
  S.tela = 'home';
  render();

  toast(conectado() ? 'Visita salva. Enviando…' : 'Visita salva no aparelho — envio quando houver internet', 'ok');
  if(conectado()) setTimeout(sincronizar, 700);
}

function salvarCorrecao(){
  const id = R.id;
  const v = S.visitas.find(function(x){ return x.id === id; });
  if(!v){ toast('Visita não encontrada','err'); return; }

  const agora = new Date().toISOString();
  const chave = chaveCliente(R.clienteDoc, R.clienteNome);

  Object.assign(v, {
    chaveCliente: chave, chaveAnterior: R.chaveAnterior || v.chaveCliente || '',
    data: R.data, acao: R.acao, modalidade: R.modalidade, tipoCliente: R.tipoCliente,
    clienteDoc: R.clienteDoc, clienteNome: R.clienteNome,
    especialidade: R.especialidade, cidade: R.cidade, uf: R.uf, farmacia: R.farmacia,
    telefone: R.telefone, email: R.email,
    apresentados: R.apresentados.join(' | '),
    conhecidos: R.conhecidos.join(' | '),
    qtdApresentados: R.apresentados.length,
    nivelConhece: R.nivelConhece, interesse: R.interesse,
    status: R.status, houveVenda: R.houveVenda, valorVenda: Number(R.valorVenda) || 0,
    notaMedico: R.notaMedico, impressaoMedico: R.impressaoMedico, objecoes: R.objecoes,
    notaVisitador: R.notaVisitador, impressaoVisitador: R.impressaoVisitador,
    precisaFollowup: R.precisaFollowup, followupData: R.followupData,
    followupAcao: R.followupAcao, obs: R.obs,
    editadoEm: agora, sync: 'EDITADO'
  });

  /* Estoque local: devolve o que a versão anterior tinha baixado e desconta o
     que ficou. Sem isso o saldo no aparelho ficaria errado até a próxima
     sincronização. O servidor refaz o cálculo dele do mesmo jeito. */
  const antes = R.entregasAnteriores || {};
  Object.keys(antes).forEach(function(item){
    S.estoque[item] = (S.estoque[item] || 0) + antes[item];
  });
  Object.keys(R.entregas).forEach(function(item){
    S.estoque[item] = Math.max(0, (S.estoque[item] || 0) - R.entregas[item]);
  });

  // Refaz as entregas locais desta visita
  S.entregas = S.entregas.filter(function(e){ return e.idVisita !== id; });
  Object.entries(R.entregas).forEach(function(par){
    const nome = par[0], qtd = par[1];
    if(qtd <= 0) return;
    const m = CAT.materiais.find(function(x){ return x.n === nome; });
    S.entregas.unshift({
      id: novoId('E'), idVisita: id, data: R.data, visitador: S.usuario.nome,
      chaveCliente: chave, clienteDoc: R.clienteDoc, clienteNome: R.clienteNome,
      cidade: R.cidade, uf: R.uf, item: nome, tipo: m ? m.t : 'BRINDE',
      qtd: qtd, origem: 'VISITA', criadoEm: agora, sync: 'EDITADO'
    });
  });

  // Follow up local
  S.followups = S.followups.filter(function(f){ return f.idVisita !== id; });
  if(R.precisaFollowup === 'SIM' && R.followupData){
    S.followups.push({
      id: novoId('F'), idVisita: id, chaveCliente: chave,
      clienteDoc: R.clienteDoc, clienteNome: R.clienteNome,
      visitador: S.usuario.nome, data: R.followupData, acao: R.followupAcao,
      cidade: R.cidade, uf: R.uf, prioridade: 'MÉDIA',
      status: 'PENDENTE', criadoEm: agora, sync: 'EDITADO'
    });
  }

  salvarTudo();
  novaVisita();
  S.tela = 'home';
  render();

  toast(conectado() && !S.demo ? 'Correção salva. Enviando…'
                               : 'Correção salva no aparelho — envio quando houver internet', 'ok');
  if(conectado() && !S.demo) setTimeout(sincronizar, 700);
}

/* Content-Type text/plain de propósito: com application/json o navegador
   dispara um preflight OPTIONS, que o Apps Script não responde — a chamada
   morreria antes de sair. */
function enviarAoServidor(corpo){
  return fetch(S.config.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(corpo),
    redirect: 'follow'
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

let sincronizando = false;

function sincronizar(){
  if(sincronizando) return;

  /* Em demonstração o envio é fingido, mas o aviso é explícito. */
  if(S.demo){
    const n = S.visitas.filter(function(v){ return v.sync !== 'OK'; }).length;
    if(!n){ toast('Nada pendente'); return; }
    setTimeout(function(){
      S.visitas.forEach(function(v){ v.sync = 'OK'; });
      S.entregas.forEach(function(e){ e.sync = 'OK'; });
      S.followups.forEach(function(f){ f.sync = 'OK'; });
      salvarTudo(); render();
      toast('Demonstração: nada foi enviado à planilha', 'err');
    }, 600);
    return;
  }

  /* Sem servidor configurado NÃO se marca nada como enviado. Marcar daria a
     impressão de que a visita chegou à planilha quando não saiu do aparelho. */
  if(!S.config.url || !S.config.token){
    toast('Configure o servidor e o token em Dados','err'); return;
  }
  if(!conectado()){ toast('Sem internet — a fila continua guardada','err'); return; }

  const novas    = S.visitas.filter(function(v){ return v.sync === 'FILA'; });
  const editadas = S.visitas.filter(function(v){ return v.sync === 'EDITADO'; });
  const entregas  = S.entregas.filter(function(e){ return e.sync !== 'OK'; });
  const followups = S.followups.filter(function(f){ return f.sync !== 'OK'; });

  if(!novas.length && !editadas.length && !entregas.length && !followups.length){
    toast('Nada pendente para enviar'); return;
  }

  sincronizando = true; render();
  toast('Enviando…');

  enviarNovas(novas, entregas, followups)
    .then(function(){ return enviarEdicoes(editadas); })
    .then(function(resumo){
      sincronizando = false; S.ultimoErro = '';
      salvarTudo(); render();
      toast(resumo, 'ok');
    })
    .catch(function(err){
      sincronizando = false;
      S.ultimoErro = String(err.message || err);
      salvarTudo(); render();
      toast('Falha ao enviar: ' + S.ultimoErro + '. A fila continua guardada.', 'err');
    });
}

function enviarNovas(visitas, entregas, followups){
  if(!visitas.length && !entregas.length && !followups.length){
    return Promise.resolve(0);
  }
  return enviarAoServidor({
    acao: 'sync', token: S.config.token,
    visitas: visitas, entregas: entregas, followups: followups
  }).then(function(r){
    if(!r.ok) throw new Error(r.erro || 'resposta sem confirmação');
    /* Marca pelos IDs que o servidor confirmou, não pelo que foi mandado.
       O que não voltar confirmado permanece na fila. */
    const c = r.confirmados || {};
    marcarEnviados(c.visitas || [], c.entregas || [], c.followups || []);
    if(r.saldo) S.estoque = r.saldo;
    return (r.gravados || {}).visitas || 0;
  });
}

/* Uma edição por vez: o servidor precisa refazer entregas, estoque e follow up
   de cada visita, e serializar evita corrida entre elas. */
function enviarEdicoes(editadas){
  let gravadas = 0;
  const fila = editadas.slice();

  function proxima(){
    if(!fila.length) return Promise.resolve();
    const v = fila.shift();
    const entregasDaVisita = {};
    S.entregas.filter(function(e){ return e.idVisita === v.id; })
              .forEach(function(e){ entregasDaVisita[e.item] = e.qtd; });

    return enviarAoServidor({
      acao: 'editar_visita', token: S.config.token,
      chaveAnterior: v.chaveAnterior || '',
      visita: Object.assign({}, v, { entregas: entregasDaVisita })
    }).then(function(r){
      if(!r.ok) throw new Error(r.erro || 'falha ao editar ' + v.id);
      v.sync = 'OK'; v.enviadoEm = new Date().toISOString();
      delete v.chaveAnterior;
      S.entregas.forEach(function(e){ if(e.idVisita === v.id) e.sync = 'OK'; });
      S.followups.forEach(function(f){ if(f.idVisita === v.id) f.sync = 'OK'; });
      if(r.saldo) S.estoque = r.saldo;
      gravadas++;
      return proxima();
    });
  }

  return proxima().then(function(){
    const pend = S.visitas.filter(function(v){ return v.sync !== 'OK'; }).length;
    return (gravadas ? gravadas + ' visita(s) corrigida(s). ' : '') +
           (pend ? pend + ' ainda na fila' : 'Tudo gravado na planilha');
  });
}

function marcarEnviados(idsV, idsE, idsF){
  const cj = function(a){ const o = {}; a.forEach(function(x){ o[x] = 1; }); return o; };
  const mv = cj(idsV), me = cj(idsE), mf = cj(idsF);
  const ts = new Date().toISOString();
  S.visitas.forEach(function(v){ if(mv[v.id]){ v.sync = 'OK'; v.enviadoEm = ts; } });
  S.entregas.forEach(function(e){ if(me[e.id]) e.sync = 'OK'; });
  S.followups.forEach(function(f){ if(mf[f.id]) f.sync = 'OK'; });
}

/* Baixa catálogos, clientes e saldo do servidor. Roda na entrada e sob demanda. */
function baixarCatalogos(){
  if(S.demo){ toast('Em demonstração não há servidor','err'); return; }
  if(!S.config.url || !S.config.token){ toast('Configure o servidor e o token','err'); return; }
  if(!conectado()){ toast('Sem internet','err'); return; }
  toast('Baixando catálogos…');

  enviarAoServidor({ acao: 'bootstrap', token: S.config.token }).then(function(r){
    if(!r.ok) throw new Error(r.erro || 'falha no bootstrap');
    aplicarBootstrap(r);
    render();
    toast('Catálogos atualizados', 'ok');
  }).catch(function(err){
    toast('Falha ao baixar: ' + err.message, 'err');
  });
}

/* Na mesclagem o servidor vence, mas o que ainda está na fila local é
   preservado — senão uma visita não enviada perderia o cliente dela. */
function mesclarClientes(locais, doServidor){
  const mapa = {};
  locais.forEach(function(c){ if(c.sync !== 'OK') mapa[c.chave] = c; });
  doServidor.forEach(function(c){ mapa[c.chave] = c; });
  return Object.keys(mapa).map(function(k){ return mapa[k]; });
}
function mesclarFollowups(locais, doServidor){
  const mapa = {};
  locais.forEach(function(f){ if(f.sync !== 'OK') mapa[f.id] = f; });
  doServidor.forEach(function(f){ mapa[f.id] = Object.assign({ sync: 'OK' }, f); });
  return Object.keys(mapa).map(function(k){ return mapa[k]; });
}

function concluirFollowup(id){
  const f = S.followups.find(x => x.id === id);
  if(!f) return;
  f.status = 'CONCLUIDO'; f.concluidoEm = new Date().toISOString(); f.sync = 'FILA';
  salvarTudo(); render(); toast('Follow up concluído','ok');
  if(S.config.url && conectado()){
    enviarAoServidor({ acao:'concluir_followup', token:S.config.token,
                       id:f.id, status:'CONCLUIDO', resultado:f.resultado || '' })
      .then(function(r){ if(r.ok){ f.sync = 'OK'; salvarTudo(); } })
      .catch(function(){ /* fica na fila; a próxima sincronização resolve */ });
  }
}

    .then(function(r){ toast(r.ok ? 'Conexão certa — servidor respondeu' : 'Resposta inesperada',
                             r.ok ? 'ok' : 'err'); })
    .catch(function(e){ toast('Não respondeu: ' + e.message, 'err'); });
}

function alternarOffline(){
  S.simularOffline = !S.simularOffline;
  render();
  toast(S.simularOffline ? 'Modo offline simulado — registre uma visita para testar' : 'De volta online');
  if(!S.simularOffline && S.visitas.some(v=>v.sync!=='OK')) setTimeout(sincronizar, 600);
}

function baixarCSV(){
  const cab = ['ID_VISITA','DATA','VISITADOR','ACAO','MODALIDADE','TIPO_CLIENTE','DOC','CLIENTE',
    'ESPECIALIDADE','CIDADE','UF','FARMACIA','APRESENTADOS','JA_CONHECIA','NIVEL','INTERESSE',
    'STATUS','VENDA','VALOR','NOTA_CLIENTE','IMPRESSAO_CLIENTE','OBJECOES','NOTA_VISITADOR',
    'IMPRESSAO_VISITADOR','FOLLOWUP','FOLLOWUP_DATA','FOLLOWUP_ACAO','OBS'];
  const linhas = S.visitas.map(v => [v.id,v.data,v.visitador,v.acao,v.modalidade,v.tipoCliente,
    v.clienteDoc,v.clienteNome,v.especialidade,v.cidade,v.uf,v.farmacia,v.apresentados,v.conhecidos,
    v.nivelConhece,v.interesse,v.status,v.houveVenda,v.valorVenda,v.notaMedico,v.impressaoMedico,
    v.objecoes,v.notaVisitador,v.impressaoVisitador,v.precisaFollowup,v.followupData,v.followupAcao,v.obs]);
  const csv = [cab].concat(linhas)
    .map(l => l.map(c => '"' + String(c==null?'':c).replace(/"/g,'""') + '"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'SGV_visitas.csv';
  a.click();
  toast('CSV gerado','ok');
}

function limparTudo(){
  if(!confirm('Apagar todas as visitas, entregas e clientes deste aparelho?')) return;
  S.visitas=[]; S.entregas=[]; S.clientes=[]; S.followups=[]; S.estoque=null; S.rascunho=null;
  DB.apagar('rascunho'); iniciarEstoque(); salvarTudo(); render(); toast('Dados apagados');
}

/* ---------- SERVICE WORKER ----------
   É o que permite ABRIR o app sem internet. Sem ele, o visitador sem sinal
   veria a tela de erro do navegador e não chegaria ao formulário.
   Falha no registro não impede o app de funcionar com conexão. */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){ /* silencioso */ });
  });
}

/* ---------- EVENTOS DE REDE ---------- */
window.addEventListener('online',  () => { S.online = true;  render(); if(S.visitas.some(v=>v.sync!=='OK')) sincronizar(); });
window.addEventListener('offline', () => { S.online = false; render(); toast('Sem internet — os registros ficam guardados'); });

/* ---------- INÍCIO ---------- */
iniciarEstoque();
novaVisita();
if(S.rascunho) R = JSON.parse(JSON.stringify(S.rascunho));
render();

/* Ao abrir o app: se houver internet e fila pendente, envia sozinho.
   É o que garante que uma visita registrada sem sinal não fique esquecida. */
if(S.usuario && conectado() && S.visitas.some(v => v.sync !== 'OK')){
  setTimeout(sincronizar, 900);
}
</script>
</body></html>
